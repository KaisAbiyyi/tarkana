name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy_key
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/tarkana_test
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/tarkana_test
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
      CI: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: tarkana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run svelte-check
        run: npm run check

      - name: Run linting
        run: npm run lint

      - name: Run database migrations against test DB
        run: npm run db:migrate

      - name: Run unit & integration tests
        run: npm run test:unit

      - name: Run production build
        run: npm run build

      - name: Run Playwright E2E tests
        run: npm run test:e2e
